name: Check links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Check links every Monday at 08:00
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@649b0e4890508ea3e11ea6b3ee35ce899a25afd5 # v2
        with:
          args: |
            .
            --max-concurrency 4
            --max-retries 5
            --retry-wait-time 5
            --timeout 30
            --exclude '(^https://doi\.org/10\.1080/00031305\.2017\.1375990$)|(gnu\.org)'
            --accept 200,429
          fail: true
